<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Highground</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --ink:#efe8d8; --dim:#a99fb8; --ok:#9fffd0; --warn:#ffd27a; --bad:#ff6b6b; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0b0d1a; color:var(--ink);
    font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; }
  #cross { position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; }
  #cross:before, #cross:after { content:""; position:absolute; background:rgba(239,232,216,.85); }
  #cross:before { left:10px; top:0; width:2px; height:22px; }
  #cross:after  { top:10px; left:0; height:2px; width:22px; }
  #tl { position:absolute; left:18px; top:14px; }
  #lvl { font-size:12px; letter-spacing:.25em; color:var(--dim); }
  #energy { font-size:28px; margin-top:2px; }
  #energy small { font-size:11px; letter-spacing:.2em; color:var(--dim); margin-left:6px; }
  #pips { display:flex; flex-wrap:wrap; gap:3px; width:260px; margin-top:6px; }
  #pips i { width:6px; height:10px; background:var(--ok); opacity:.85; border-radius:1px; }
  #wstat { margin-top:10px; font-size:12px; color:var(--dim); }
  #gaze { position:absolute; right:18px; top:14px; text-align:right; }
  #gaze .eye { display:inline-block; width:46px; height:26px; border:2px solid var(--dim); border-radius:50%;
    position:relative; transition:border-color .2s; }
  #gaze .eye:after { content:""; position:absolute; left:50%; top:50%; width:10px; height:10px; margin:-5px 0 0 -5px;
    border-radius:50%; background:var(--dim); transition:background .2s, transform .2s; transform:scale(.4); }
  #gaze .lbl { font-size:12px; letter-spacing:.25em; margin-top:4px; color:var(--dim); }
  #gaze.s1 .eye { border-color:var(--warn); } #gaze.s1 .eye:after { background:var(--warn); transform:scale(1); }
  #gaze.s1 .lbl { color:var(--warn); }
  #gaze.s2 .eye { border-color:var(--bad); } #gaze.s2 .eye:after { background:var(--bad); transform:scale(1.4); }
  #gaze.s2 .lbl { color:var(--bad); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  #info { position:absolute; left:0; right:0; top:calc(50% + 26px); text-align:center; font-size:13px;
    text-shadow:0 1px 3px #000; color:var(--ink); }
  #info .no { color:var(--dim); }
  #toast { position:absolute; left:0; right:0; top:22%; text-align:center; font-size:16px; letter-spacing:.08em;
    text-shadow:0 1px 4px #000; opacity:0; transition:opacity .3s; }
  #legend { position:absolute; left:0; right:0; bottom:12px; text-align:center; font-size:11px; color:var(--dim);
    letter-spacing:.05em; text-shadow:0 1px 2px #000; }
  #legend b { color:var(--ink); font-weight:normal; border:1px solid rgba(239,232,216,.35); border-radius:3px; padding:0 4px; }
  #compass { position:absolute; left:50%; top:14px; width:440px; margin-left:-220px; height:24px;
    border-bottom:1px solid rgba(239,232,216,.25);
    background:linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,.1) 25%, rgba(0,0,0,.1) 75%, rgba(0,0,0,.35)); }
  #compass .t { position:absolute; bottom:0; width:1px; height:6px; background:rgba(239,232,216,.35); }
  #compass .t.c { left:50%; height:10px; background:rgba(239,232,216,.8); }
  #compass .t.l { left:25%; } #compass .t.r { left:75%; }
  #compass .lb { position:absolute; top:28px; font-size:10px; color:var(--dim); letter-spacing:.15em; transform:translateX(-50%); }
  #compass .m { position:absolute; top:5px; width:14px; height:14px; margin-left:-7px; border-radius:50%;
    border:2px solid #ffc36b; box-sizing:border-box; transition:background .15s; }
  #compass .m.sentry { border-color:#ff7a6b; width:10px; height:10px; margin-left:-5px; top:7px; }
  #compass .m.plinth { border-color:var(--ok); border-radius:2px; transform:rotate(45deg); }
  #compass .m.gaze { background:rgba(255,195,107,.45); }
  #compass .m.sentry.gaze { background:rgba(255,122,107,.45); }
  #compass .m.seen { background:var(--bad); border-color:var(--bad); box-shadow:0 0 8px var(--bad); }
  #compass .m.soon { animation: blink .25s steps(2) infinite; }
  #compass .m.wisp { border:0; width:8px; height:8px; margin-left:-4px; top:8px; background:#b98cff; box-shadow:0 0 6px #b98cff; }
  #compass .m.wisp.hunt { background:#e2c4ff; box-shadow:0 0 10px #c58bff; animation: blink .4s steps(2) infinite; }
  #wisps { margin-top:6px; font-size:12px; letter-spacing:.15em; color:#d2a8ff; }
  #tut { position:absolute; left:18px; bottom:44px; width:360px; padding:12px 14px; display:none;
    background:rgba(10,9,24,.78); border-left:3px solid var(--ok); font-size:13px; line-height:1.55; }
  #tut .h { font-size:11px; letter-spacing:.22em; color:var(--ok); margin-bottom:4px; }
  #tut b { color:#fff; font-weight:normal; border-bottom:1px solid rgba(159,255,208,.5); }
  #hint { position:absolute; left:50%; bottom:40px; width:560px; margin-left:-280px; text-align:center; font-size:13px;
    line-height:1.5; padding:8px 12px; background:rgba(10,9,24,.7); opacity:0; transition:opacity .4s; }
  #hint span { color:var(--warn); letter-spacing:.2em; font-size:11px; margin-right:4px; }
  #hint i { color:var(--dim); font-style:normal; font-size:11px; margin-left:6px; }
  /* ---- touch controls ---- */
  #touch { display:none; }
  body.touch #touch { display:block; }
  body.touch #legend { display:none; }
  body, canvas { touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #touch button { pointer-events:auto; position:absolute; font:inherit; color:var(--ink); letter-spacing:.12em;
    background:rgba(14,12,30,.55); border:1px solid rgba(239,232,216,.35); border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
  #touch button small { font-size:9px; color:var(--dim); margin-top:1px; }
  #touch button.on { background:rgba(159,255,208,.35); border-color:var(--ok); }
  #touch .pause { right:16px; top:84px; width:44px; height:44px; font-size:13px; }
  #touch .tips { right:68px; top:84px; width:44px; height:44px; font-size:9px; }
  #touch .turn { left:16px; bottom:22px; width:64px; height:64px; font-size:22px; }
  #touch .pad { position:absolute; right:12px; bottom:14px; width:220px; height:210px; }
  #touch .pad button { width:68px; height:68px; font-size:10px; }
  #touch .pad [data-a=absorb] { right:4px; bottom:4px; width:96px; height:96px; font-size:12px; border-color:var(--ok); }
  #touch .pad [data-a=transfer] { right:110px; bottom:0; font-size:9px; }
  #touch .pad [data-a=leap] { right:136px; bottom:76px; }
  #touch .pad [data-a=vessel] { right:68px; bottom:112px; }
  #touch .pad [data-a=stone] { right:0; bottom:112px; }
  body.touch #tut { bottom:auto; top:120px; width:min(320px, 46vw); font-size:12px; }
  body.touch #hint { bottom:auto; top:120px; }
  body.touch #info { top:calc(50% + 20px); font-size:12px; }
  /* ---- small screens ---- */
  #compass { width:min(440px, 56vw); margin-left:calc(min(440px, 56vw) / -2); }
  #hint { width:min(560px, 86vw); margin-left:calc(min(560px, 86vw) / -2); }
  #tut { width:min(360px, 70vw); }
  .panel { max-height:94vh; overflow-y:auto; box-sizing:border-box; }
  @media (max-width:700px), (max-height:500px) {
    #energy { font-size:22px; } #pips { width:150px; } #wstat, #wisps { font-size:10px; }
    #gaze .lbl { font-size:10px; } #compass .lb { display:none; }
    .panel { padding:16px 18px; } .panel h1 { font-size:24px; letter-spacing:.35em; }
    .panel p, .panel li { font-size:12px; line-height:1.45; } .panel button { margin-top:10px; padding:9px 14px; font-size:12px; }
  }
  #vig { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 45%, rgba(255,40,40,.55) 100%); opacity:0; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; }
  #overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(14,12,30,.72), rgba(6,6,14,.94)); }
  #overlay.show { display:flex; }
  .panel { max-width:620px; padding:28px 34px; }
  .panel h1 { font-weight:normal; letter-spacing:.5em; font-size:34px; margin:0 0 4px; }
  .panel .tag { color:var(--warn); letter-spacing:.15em; font-size:13px; margin:0 0 22px; }
  .panel p, .panel li { font-size:13px; line-height:1.6; color:#d9d2c4; }
  .panel ul { padding-left:18px; }
  .panel .keys { color:var(--dim); font-size:12px; }
  .panel button { pointer-events:auto; font:inherit; font-size:14px; letter-spacing:.2em; color:#0b0d1a;
    background:var(--ok); border:0; padding:10px 22px; margin:14px 10px 0 0; cursor:pointer; border-radius:2px; }
  .panel .time { font-size:30px; margin:0 0 10px; color:var(--ink); }
  .panel .time small { font-size:12px; color:var(--dim); letter-spacing:.1em; }
  .panel .rec { font-size:11px; letter-spacing:.2em; color:#0b0d1a; background:var(--warn); padding:2px 6px; vertical-align:middle; }
  .panel table.stats { border-collapse:collapse; font-size:13px; margin:4px 0 8px; }
  .panel table.stats td { padding:3px 18px 3px 0; color:#d9d2c4; }
  .panel table.stats td:nth-child(odd) { color:var(--dim); font-size:11px; letter-spacing:.15em; text-transform:uppercase; }
  .panel .small { font-size:12px; color:var(--dim); margin:6px 0 0; }
  .panel .code { font-size:11px; color:var(--dim); letter-spacing:.15em; margin-top:18px; }
  .panel .code b { color:var(--ok); font-weight:normal; letter-spacing:.25em; }
  .panel .codein { margin-top:18px; display:flex; align-items:center; gap:0; }
  .panel .codein input { pointer-events:auto; font:inherit; font-size:14px; letter-spacing:.3em; text-transform:uppercase;
    width:150px; padding:9px 10px; margin:14px 10px 0 0; background:rgba(0,0,0,.35); color:var(--ink);
    border:1px solid rgba(239,232,216,.4); border-radius:2px; outline:none; }
  .panel .codein input:focus { border-color:var(--ok); }
  .panel #codeMsg { margin:14px 0 0 4px; font-size:12px; color:var(--bad); }
  .panel button.alt { background:transparent; color:var(--ink); border:1px solid rgba(239,232,216,.4); }
</style>
</head>
<body>
<div id="hud">
  <div id="cross"></div>
  <div id="compass"><div class="t l"></div><div class="t c"></div><div class="t r"></div>
    <div class="lb" style="left:0">BEHIND</div><div class="lb" style="left:50%">AHEAD</div><div class="lb" style="left:100%">BEHIND</div></div>
  <div id="tl">
    <div id="lvl">LEVEL 1</div>
    <div id="energy">10<small>ENERGY</small></div>
    <div id="pips"></div>
    <div id="wstat"></div>
    <div id="wisps"></div>
  </div>
  <div id="gaze"><div class="eye"></div><div class="lbl">UNSEEN</div></div>
  <div id="info"></div>
  <div id="toast"></div>
  <div id="tut"></div>
  <div id="hint"></div>
  <div id="legend">
    <b>A</b>/<b>LMB</b> absorb &nbsp; <b>Q</b> stone (2) &nbsp; <b>E</b> vessel (3) &nbsp;
    <b>F</b>/<b>RMB</b> transfer &nbsp; <b>SPACE</b> leap (3) / ascend &nbsp; <b>R</b> turn around &nbsp; <b>H</b> tips &nbsp; <b>ARROWS</b> look &nbsp; <b>ESC</b> pause
  </div>
  <div id="touch">
    <button data-a="pause" class="pause">❚❚</button>
    <button data-a="hints" class="tips">TIPS</button>
    <button data-a="turn" class="turn">↻<small>TURN</small></button>
    <div class="pad">
      <button data-a="stone">STONE<small>2</small></button>
      <button data-a="vessel">VESSEL<small>3</small></button>
      <button data-a="leap">LEAP<small>3</small></button>
      <button data-a="transfer">TRANSFER</button>
      <button data-a="absorb" class="big">ABSORB</button>
    </div>
  </div>
  <div id="vig"></div>
  <div id="flash"></div>
</div>
<div id="overlay" class="show"><div class="panel" id="panel"></div></div>

<!--GAME-->
</body>
</html>
